##############################
# AI Provider
##############################
ai.running-plan-provider-url=${AI_RUNNING_PLAN_PROVIDER_URL}
ai.running-plan-provider-model=${AI_RUNNING_PLAN_PROVIDER_MODEL}
ai.running-plan-provider-connect-timeout=${AI_RUNNING_PLAN_PROVIDER_CONNECT_TIMEOUT:5s}
ai.running-plan-provider-read-timeout=${AI_RUNNING_PLAN_PROVIDER_READ_TIMEOUT:120s}

##############################
# Persistence
##############################
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

##############################
# Actuator
##############################
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

##############################
# CORS
##############################
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
api.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
api.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
api.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
api.cors.max-age=${CORS_MAX_AGE:PT1H}

##############################
# Security
##############################
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
api.security.token.issuer=${API_SECURITY_TOKEN_ISSUER}
api.security.token.expiration-minutes=${API_SECURITY_TOKEN_EXPIRATION_MINUTES:120}
api.security.headers.hsts-enabled=${SECURITY_HEADERS_HSTS_ENABLED:true}
api.security.headers.hsts-max-age=${SECURITY_HEADERS_HSTS_MAX_AGE:365d}
api.security.headers.hsts-include-sub-domains=${SECURITY_HEADERS_HSTS_INCLUDE_SUB_DOMAINS:true}

##############################
# Password Recovery
##############################
password-recovery.mail.frontend-base-url=${FRONTEND_BASE_URL}

##############################
# Rate Limiting
##############################
api.rate-limit.login-ip.enabled=${LOGIN_IP_RATE_LIMIT_ENABLED:true}
api.rate-limit.login-ip.capacity=${LOGIN_IP_RATE_LIMIT_CAPACITY:10}
api.rate-limit.login-ip.refill-period=${LOGIN_IP_RATE_LIMIT_REFILL_PERIOD:PT1M}
api.rate-limit.login-email.enabled=${LOGIN_EMAIL_RATE_LIMIT_ENABLED:true}
api.rate-limit.login-email.capacity=${LOGIN_EMAIL_RATE_LIMIT_CAPACITY:5}
api.rate-limit.login-email.refill-period=${LOGIN_EMAIL_RATE_LIMIT_REFILL_PERIOD:PT15M}
api.rate-limit.login-email-origin.enabled=${LOGIN_EMAIL_ORIGIN_RATE_LIMIT_ENABLED:true}
api.rate-limit.login-email-origin.capacity=${LOGIN_EMAIL_ORIGIN_RATE_LIMIT_CAPACITY:5}
api.rate-limit.login-email-origin.refill-period=${LOGIN_EMAIL_ORIGIN_RATE_LIMIT_REFILL_PERIOD:PT15M}
api.rate-limit.registration-origin.enabled=${REGISTRATION_ORIGIN_RATE_LIMIT_ENABLED:true}
api.rate-limit.registration-origin.capacity=${REGISTRATION_ORIGIN_RATE_LIMIT_CAPACITY:5}
api.rate-limit.registration-origin.refill-period=${REGISTRATION_ORIGIN_RATE_LIMIT_REFILL_PERIOD:PT1H}
api.rate-limit.registration-email.enabled=${REGISTRATION_EMAIL_RATE_LIMIT_ENABLED:true}
api.rate-limit.registration-email.capacity=${REGISTRATION_EMAIL_RATE_LIMIT_CAPACITY:3}
api.rate-limit.registration-email.refill-period=${REGISTRATION_EMAIL_RATE_LIMIT_REFILL_PERIOD:PT1H}
api.rate-limit.password-recovery-start-origin.enabled=${PASSWORD_RECOVERY_START_ORIGIN_RATE_LIMIT_ENABLED:true}
api.rate-limit.password-recovery-start-origin.capacity=${PASSWORD_RECOVERY_START_ORIGIN_RATE_LIMIT_CAPACITY:5}
api.rate-limit.password-recovery-start-origin.refill-period=${PASSWORD_RECOVERY_START_ORIGIN_RATE_LIMIT_REFILL_PERIOD:PT1H}
api.rate-limit.password-recovery-start-email.enabled=${PASSWORD_RECOVERY_START_EMAIL_RATE_LIMIT_ENABLED:true}
api.rate-limit.password-recovery-start-email.capacity=${PASSWORD_RECOVERY_START_EMAIL_RATE_LIMIT_CAPACITY:3}
api.rate-limit.password-recovery-start-email.refill-period=${PASSWORD_RECOVERY_START_EMAIL_RATE_LIMIT_REFILL_PERIOD:PT1H}
api.rate-limit.password-recovery-complete-origin.enabled=${PASSWORD_RECOVERY_COMPLETE_ORIGIN_RATE_LIMIT_ENABLED:true}
api.rate-limit.password-recovery-complete-origin.capacity=${PASSWORD_RECOVERY_COMPLETE_ORIGIN_RATE_LIMIT_CAPACITY:10}
api.rate-limit.password-recovery-complete-origin.refill-period=${PASSWORD_RECOVERY_COMPLETE_ORIGIN_RATE_LIMIT_REFILL_PERIOD:PT15M}
api.rate-limit.generic-api.enabled=${GENERIC_API_RATE_LIMIT_ENABLED:true}
api.rate-limit.generic-api.capacity=${GENERIC_API_RATE_LIMIT_CAPACITY:120}
api.rate-limit.generic-api.refill-period=${GENERIC_API_RATE_LIMIT_REFILL_PERIOD:PT1M}

##############################
# Strava
##############################
strava.authorization-url=${STRAVA_AUTHORIZATION_URL}
strava.token-url=${STRAVA_TOKEN_URL}
strava.deauthorization-url=${STRAVA_DEAUTHORIZATION_URL}
strava.activities-url=${STRAVA_ACTIVITIES_URL}
strava.activity-detail-url=${STRAVA_ACTIVITY_DETAIL_URL}
strava.activity-streams-url=${STRAVA_ACTIVITY_STREAMS_URL}
strava.athlete-zones-url=${STRAVA_ATHLETE_ZONES_URL}
strava.client-id=${STRAVA_CLIENT_ID}
strava.client-secret=${STRAVA_CLIENT_SECRET}
strava.connect-timeout=${STRAVA_CONNECT_TIMEOUT:2s}
strava.read-timeout=${STRAVA_READ_TIMEOUT:5s}
strava.redirect-uri=${STRAVA_REDIRECT_URI}
strava.frontend-success-redirect-url=${STRAVA_FRONTEND_SUCCESS_REDIRECT_URL}
strava.frontend-failure-redirect-url=${STRAVA_FRONTEND_FAILURE_REDIRECT_URL}

##############################
# Strava Sync
##############################
strava.summary-sync.polling-interval=${STRAVA_SUMMARY_SYNC_POLLING_INTERVAL:PT24H}
strava.summary-sync.worker-interval=${STRAVA_SUMMARY_SYNC_WORKER_INTERVAL:PT1M}
strava.summary-sync.retry-backoff=${STRAVA_SUMMARY_SYNC_RETRY_BACKOFF:PT15M}
strava.summary-sync.max-attempts=${STRAVA_SUMMARY_SYNC_MAX_ATTEMPTS:3}
strava.summary-sync.scheduling-enabled=${STRAVA_SUMMARY_SYNC_SCHEDULING_ENABLED:true}
strava.stream-sync.worker-interval=${STRAVA_STREAM_SYNC_WORKER_INTERVAL:PT1M}
strava.stream-sync.retry-backoff=${STRAVA_STREAM_SYNC_RETRY_BACKOFF:PT15M}
strava.stream-sync.max-attempts=${STRAVA_STREAM_SYNC_MAX_ATTEMPTS:3}
strava.stream-sync.scheduling-enabled=${STRAVA_STREAM_SYNC_SCHEDULING_ENABLED:true}

##############################
# Documentation
##############################
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
