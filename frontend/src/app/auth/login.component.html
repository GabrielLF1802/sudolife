<section class="auth-panel" aria-labelledby="login-title">
  <div>
    <p class="eyebrow">Atleta</p>
    <h1 id="login-title">Entrar</h1>
    <p class="summary">Acesse o painel de atividades com sua conta Sudolife.</p>
  </div>

  <form (ngSubmit)="login()" #loginForm="ngForm">
    <label>
      Email
      <input
        type="email"
        name="email"
        autocomplete="email"
        maxlength="254"
        required
        [attr.aria-invalid]="errorMessage() ? 'true' : null"
        [attr.aria-describedby]="errorMessage() ? 'login-error' : null"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />
    </label>

    <label>
      Senha
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        maxlength="128"
        required
        [attr.aria-invalid]="errorMessage() ? 'true' : null"
        [attr.aria-describedby]="errorMessage() ? 'login-error' : null"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
      />
    </label>

    @if (errorMessage()) {
      <p class="form-error" id="login-error" role="alert">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="loginForm.invalid || submitting()"
      [attr.aria-busy]="submitting()"
    >
      {{ submitting() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p class="switch-link">Novo por aqui? <a routerLink="/register">Crie sua conta</a></p>
</section>
