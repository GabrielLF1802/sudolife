<section class="auth-panel" aria-labelledby="register-title">
  <div>
    <p class="eyebrow">Cadastro</p>
    <h1 id="register-title">Criar conta</h1>
    <p class="summary">Informe seus dados para iniciar o acompanhamento das atividades.</p>
  </div>

  <form (ngSubmit)="register()" #registerForm="ngForm">
    <label>
      Nome
      <input
        type="text"
        name="name"
        autocomplete="name"
        maxlength="100"
        required
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
      />
    </label>

    <label>
      Email
      <input
        type="email"
        name="email"
        autocomplete="email"
        maxlength="254"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />
    </label>

    <label>
      Senha
      <input
        type="password"
        name="password"
        autocomplete="new-password"
        minlength="8"
        maxlength="128"
        required
        aria-describedby="password-guidance"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
      />
    </label>

    <p class="field-guidance" id="password-guidance">Use pelo menos 8 caracteres.</p>

    @if (errorMessage()) {
      <p class="form-error" id="register-error" role="alert">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="registerForm.invalid || submitting()"
      [attr.aria-busy]="submitting()"
    >
      {{ submitting() ? 'Criando...' : 'Criar conta' }}
    </button>
  </form>

  <p class="switch-link">Já tem conta? <a routerLink="/login">Entrar</a></p>
</section>
