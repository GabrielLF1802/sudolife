name: sudolife

services:
  db-sudolife:
    image: postgres:16.2-alpine3.18
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_ROOT_USER}", "-d", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: sudolife-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./create_database.sh:/docker-entrypoint-initdb.d/create_database.sh
      - sudolife-db-data:/var/lib/postgresql/data
    networks:
      - sudolife-network

  app-sudolife:
    build:
      context: ..
      dockerfile: Dockerfile
    image: gabriellf1802/sudolife:${APP_VERSION}
    container_name: sudolife-backend
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      API_SECURITY_TOKEN_SECRET: ${API_SECURITY_TOKEN_SECRET}
      API_SECURITY_TOKEN_ISSUER: ${API_SECURITY_TOKEN_ISSUER}
      API_SECURITY_TOKEN_EXPIRATION_MINUTES: ${API_SECURITY_TOKEN_EXPIRATION_MINUTES}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS}
      CORS_MAX_AGE: ${CORS_MAX_AGE}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_AUTHORIZATION_URL: ${STRAVA_AUTHORIZATION_URL}
      STRAVA_TOKEN_URL: ${STRAVA_TOKEN_URL}
      STRAVA_DEAUTHORIZATION_URL: ${STRAVA_DEAUTHORIZATION_URL}
      STRAVA_ACTIVITIES_URL: ${STRAVA_ACTIVITIES_URL}
      STRAVA_ACTIVITY_DETAIL_URL: ${STRAVA_ACTIVITY_DETAIL_URL}
      STRAVA_ACTIVITY_STREAMS_URL: ${STRAVA_ACTIVITY_STREAMS_URL}
      STRAVA_ATHLETE_ZONES_URL: ${STRAVA_ATHLETE_ZONES_URL}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI}
      STRAVA_FRONTEND_SUCCESS_REDIRECT_URL: ${STRAVA_FRONTEND_SUCCESS_REDIRECT_URL}
      STRAVA_FRONTEND_FAILURE_REDIRECT_URL: ${STRAVA_FRONTEND_FAILURE_REDIRECT_URL}
      AI_RUNNING_PLAN_PROVIDER_URL: ${AI_RUNNING_PLAN_PROVIDER_URL}
      AI_RUNNING_PLAN_PROVIDER_MODEL: ${AI_RUNNING_PLAN_PROVIDER_MODEL}
      AI_RUNNING_PLAN_PROVIDER_CONNECT_TIMEOUT: ${AI_RUNNING_PLAN_PROVIDER_CONNECT_TIMEOUT}
      AI_RUNNING_PLAN_PROVIDER_READ_TIMEOUT: ${AI_RUNNING_PLAN_PROVIDER_READ_TIMEOUT}
    depends_on:
      db-sudolife:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - sudolife-network
    restart: always

  ollama-sudolife:
    image: ollama/ollama:latest
    container_name: sudolife-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - sudolife-ollama-data:/root/.ollama
    networks:
      - sudolife-network
    restart: unless-stopped

  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: sudolife-ollama-model-pull
    environment:
      OLLAMA_HOST: http://ollama-sudolife:11434
      OLLAMA_MODEL: ${AI_RUNNING_PLAN_PROVIDER_MODEL:-llama3:8b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"$${OLLAMA_MODEL}\""]
    depends_on:
      ollama-sudolife:
        condition: service_started
    networks:
      - sudolife-network
    restart: "no"

networks:
  sudolife-network:
    driver: bridge

volumes:
  sudolife-db-data:
  sudolife-ollama-data:
